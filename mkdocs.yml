site_name: Pages
site_description: No fluff. Just the details engineers care about.
site_author: Subroto Kumar
site_url: https://pages.subrotokumar.dev
repo_url: https://subrotokumar.dev
repo_name: subrotokumar.dev
copyright: Copyright &copy; 2025 Subroto Kumar
dev_addr: localhost:8000

theme:
  font:
    code: JetBrains Mono
  icon:
    repo: fontawesome/solid/terminal

  palette:
  - scheme: default
    toggle:
      icon: lucide/sun
      name: Switch to dark mode
  - scheme: slate
    toggle:
      icon: lucide/moon
      name: Switch to light mode
  favicon: images/logo1.png
  logo: images/logo1.png
  language: en
  features:
  - announce.dismiss
  - content.code.annotate
  - content.code.copy
  - content.code.select
  - content.footnote.tooltips
  - content.tabs.link
  - content.tooltips
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.instant.prefetch
  # - navigation.path
  - navigation.sections
  - navigation.tabs
  - navigation.top
  - navigation.tracking
  - search.highlight

  hide:
    - navigation

extra:
  generator: false
  consent:
    title: Cookie consent
    description: >2
        We use cookies to recognize your repeated visits and preferences, as well
        as to measure the effectiveness of our documentation and whether users
        find what they're searching for. With your consent, you're helping us to
        make our documentation better.
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/subrotokumar/pages
  - icon: fontawesome/brands/linkedin
    link: https://linkedin.com/in/kumarsubroto
  - icon: fontawesome/brands/x-twitter
    link: https://x.com/isubrotokumar

extra_javascript:
  - javascripts/mermaid.mjs
  

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      toc_depth: 0

nav:
  - Home: index.md
  - System Design:
    - Caching: 
      - system_design/caching/index.md
      - Cache Stampede: system_design/caching/cache_stampede.md
    - Deep Dive:
      # - Network Essential: system_design/deep_dive/networking.md
      - Data structure for Big Data: system_design/deep_dive/data_structure_for_big_data.md
  - Kubernetes: 
    - kubernetes/index.md
    - Managing secrets kubernetes sops age: kubernetes/managing-secrets-kubernetes-sops-age.md